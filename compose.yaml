services:
  api:
    build:
      context: .
      dockerfile: src/Nookly.Api/Dockerfile
    container_name: nookly-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=nookly;Username=nookly;Password=nookly_dev_password
      NOOKLY_JWT_KEY: ${NOOKLY_JWT_KEY:?Define NOOKLY_JWT_KEY in .env}
      NOOKLY_DEMO_USERS: ${NOOKLY_DEMO_USERS:-}
      NOOKLY_ADMIN_PASSWORD: ${NOOKLY_ADMIN_PASSWORD:-}
      NOOKLY_PUBLIC_API_URL: http://localhost:5186
      Tmdb__ReadAccessToken: ${TMDB_READ_ACCESS_TOKEN:-}
      NOOKLY_SMTP_HOST: ${NOOKLY_SMTP_HOST:-}
      NOOKLY_SMTP_PORT: ${NOOKLY_SMTP_PORT:-587}
      NOOKLY_SMTP_USER: ${NOOKLY_SMTP_USER:-}
      NOOKLY_SMTP_PASSWORD: ${NOOKLY_SMTP_PASSWORD:-}
      NOOKLY_SMTP_FROM: ${NOOKLY_SMTP_FROM:-}
    ports:
      - "5186:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: nookly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nookly
      POSTGRES_USER: nookly
      POSTGRES_PASSWORD: nookly_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nookly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nookly -d nookly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nookly-postgres-data:
