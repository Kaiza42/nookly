name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish release artifacts
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Nookly.sln

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Test release candidate
        run: dotnet test Nookly.sln --configuration Release --no-restore

      - name: Publish Windows desktop
        run: >-
          dotnet publish src/Nookly.Desktop/Nookly.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/Nookly-Desktop-win-x64
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Download previous desktop release
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts/velopack | Out-Null
          vpk download github `
            --repoUrl "${{ github.server_url }}/${{ github.repository }}" `
            --token "$env:GH_TOKEN" `
            --outputDir artifacts/velopack

      - name: Build Windows installer and update packages
        shell: pwsh
        run: >-
          vpk pack
          --packId Nookly.Desktop
          --packTitle Nookly
          --packAuthors Kaiza42
          --packVersion "$env:RELEASE_VERSION"
          --packDir artifacts/Nookly-Desktop-win-x64
          --mainExe Nookly.Desktop.exe
          --runtime win-x64
          --outputDir artifacts/velopack

      - name: Publish Linux API
        run: >-
          dotnet publish src/Nookly.Api/Nookly.Api.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --output artifacts/Nookly-Api-linux-x64
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create archives
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/Nookly-Api-linux-x64/* -DestinationPath artifacts/Nookly-Api-linux-x64.zip

      - name: Publish installer and update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github `
            --repoUrl "${{ github.server_url }}/${{ github.repository }}" `
            --token "$env:GH_TOKEN" `
            --outputDir artifacts/velopack `
            --publish `
            --merge `
            --tag "${{ github.ref_name }}" `
            --releaseName "Nookly ${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" artifacts/Nookly-Api-linux-x64.zip --clobber

  container:
    name: Publish API container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set container image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nookly-api" >> "$GITHUB_ENV"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Nookly.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
