name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore Nookly.sln

      - name: Verify formatting
        run: dotnet format Nookly.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Nookly.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: >-
          dotnet test Nookly.sln
          --configuration Release
          --no-build
          --logger trx
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Verify Entity Framework migrations
        env:
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=nookly_ci;Username=nookly;Password=nookly
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --configuration Release
          --no-build
          --project src/Nookly.Infrastructure/Nookly.Infrastructure.csproj
          --startup-project src/Nookly.Api/Nookly.Api.csproj

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
